    <!-- Google Ads Lightweight Dynamic Tracker -->
    <script>
      (function() {
        // Parse and store UTM & Google Click ID parameters for server-side attribution
        const urlParams = new URLSearchParams(window.location.search);
        const trackingParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'wbraid', 'gbraid'];
        const savedParams = {};
        
        trackingParams.forEach(param => {
          const val = urlParams.get(param);
          if (val) {
            savedParams[param] = val;
            localStorage.setItem(`neonforge_${param}`, val);
          }
        });

        // Initialize Google Ads global site tag if Tag ID exists
        const googleAdsId = localStorage.getItem('neonforge_google_ads_tag_id') || window.VITE_GOOGLE_ADS_ID;
        if (googleAdsId) {
          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${googleAdsId}`;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', googleAdsId, {
            'cookie_flags': 'SameSite=None;Secure',
            'store_gclid': true
          });
          console.log(`[Google Ads] Site tag initialized for ${googleAdsId}`);
        }
      })();
    </script>
